name: Deploy Scala.js app to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test

      - name: Build JavaScript
        run:  | 
          sbt fullLinkJS
          cp -f target/scala-3.3.6/scala-tictactoe-opt/main.js deployment/
      # note: no source maps are copied to deployment

      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"

      # - name: Install Playwright
      #   run: |
      #     npm install
      #     npx playwright install --with-deps chromium

      # - name: Run browser test
      #   run: npm run test:e2e

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: deployment/

      - name: Deploy
        uses: actions/deploy-pages@v4
