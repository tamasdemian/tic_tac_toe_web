name: Deploy Scala.js app to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Build Scala.js
        run: sbt fullLinkJS

      - name: Prepare website
        run: |
          mkdir -p _site
          cp -R deployment/. _site/
          rm -f _site/*.map

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        uses: actions/deploy-pages@v4
